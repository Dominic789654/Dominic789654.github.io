<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 768" width="400" height="768" role="img">
  <title>SGLang decision scoring</title>
  <desc>A client calls POST /v1/decisions or POST /v1/systemone. The engine scores next-token logits at answer labels. /v1/decisions returns probabilities and label_mass; /v1/systemone returns x_label_mass / confidence. Completion tokens are zero. These are not calibrated correctness.</desc>
  <defs>
    <marker id="arr-f2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path class="marker" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #faf9f5; }
    .panel { fill: #f0eee6; stroke: #d4cec0; stroke-width: 1; }
    .panel-accent { fill: rgba(204,120,92,.12); stroke: #cc785c; stroke-width: 1.25; }
    .panel-muted { fill: transparent; stroke: #b5af9f; stroke-width: 1; stroke-dasharray: 4 3; }
    .chip { fill: #faf9f5; stroke: #cc785c; stroke-width: 1; }
    .chip-quiet { fill: #faf9f5; stroke: #d4cec0; stroke-width: 1; }
    .t { fill: #3d3929; }
    .tm { fill: #6f6a5e; }
    .ta { fill: #cc785c; }
    .line, .curve { stroke: #cc785c; stroke-width: 1.6; fill: none; }
    .loop { stroke: #cc785c; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .marker, .bar { fill: #cc785c; }
    .hair { stroke: #e4dfd3; stroke-width: 1; }
    text { font-family: Newsreader, "Iowan Old Style", Georgia, serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
    
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1915; }
      .panel, .chip-quiet { fill: #262220; stroke: #4a443c; }
      .panel-accent, .chip { fill: rgba(232,155,122,.12); stroke: #e89b7a; }
      .panel-muted { stroke: #9a958b; }
      .t { fill: #e8e4dc; }
      .tm { fill: #b8b2a6; }
      .ta, .marker, .bar { fill: #e89b7a; }
      .line, .curve, .loop { stroke: #e89b7a; }
      .hair { stroke: #3a3530; }
    }
  </style>
  <rect class="bg" width="400" height="768"/>
  <text class="mono ta" x="20" y="28" font-size="11" letter-spacing="1.4">DECISION SCORING</text>
  <text class="tm" x="20" y="48" font-size="13">SGLang docs · checked Oct 2026</text>

  <rect class="panel" x="20" y="66" width="174" height="118" rx="2"/>
  <text class="mono t" x="32" y="90" font-size="11">POST /v1/decisions</text>
  <text class="mono tm" x="32" y="112" font-size="12">choice</text>
  <text class="mono tm" x="32" y="130" font-size="12">score</text>
  <text class="mono tm" x="32" y="148" font-size="12">yes_no</text>
  <text class="tm" x="32" y="170" font-size="12">typed question</text>

  <rect class="panel" x="206" y="66" width="174" height="118" rx="2"/>
  <text class="mono t" x="218" y="90" font-size="11">POST /v1/systemone</text>
  <text class="mono tm" x="218" y="112" font-size="12">noul</text>
  <text class="mono tm" x="218" y="130" font-size="12">choice</text>
  <text class="mono tm" x="218" y="148" font-size="12">score</text>
  <text class="tm" x="218" y="170" font-size="12">TypeSafe clients</text>

  <path class="line" d="M107 184 V204 H200 V220" marker-end="url(#arr-f2)"/>
  <path class="line" d="M293 184 V204 H200"/>

  <rect class="panel" x="20" y="226" width="360" height="156" rx="2"/>
  <text class="t" x="36" y="252" font-size="16">Next-token logits</text>
  <text class="tm" x="36" y="274" font-size="13">scored at the answer labels</text>
  <line class="hair" x1="36" y1="290" x2="364" y2="290"/>
  <text class="ta" x="36" y="314" font-size="13">Ordinary chat models</text>
  <text class="t" x="36" y="334" font-size="13">shared path · thinking forced off</text>
  <text class="ta" x="36" y="358" font-size="13">Jev-style checkpoints</text>
  <text class="t" x="36" y="378" font-size="13">their own calibrated path</text>

  <line class="line" x1="200" y1="382" x2="200" y2="402" marker-end="url(#arr-f2)"/>

  <rect class="panel-accent" x="20" y="406" width="360" height="176" rx="2"/>
  <text class="mono ta" x="36" y="428" font-size="11" letter-spacing="0.8">RETURN</text>
  <text class="mono ta" x="36" y="452" font-size="12">/v1/decisions</text>
  <text class="mono t" x="36" y="474" font-size="14">probabilities · label_mass</text>
  <text class="mono ta" x="36" y="502" font-size="12">/v1/systemone</text>
  <text class="mono t" x="36" y="524" font-size="14">x_label_mass / confidence</text>
  <text class="t" x="36" y="552" font-size="14">completion tokens = 0</text>

  <rect class="bar" x="20" y="600" width="3" height="148"/>
  <rect class="panel" x="23" y="600" width="357" height="148" rx="2"/>
  <text class="ta mono" x="40" y="624" font-size="11" letter-spacing="0.8">CAVEAT</text>
  <text class="t" x="40" y="650" font-size="15">Not calibrated correctness.</text>
  <text class="tm" x="40" y="674" font-size="13">label_mass, x_label_mass, and</text>
  <text class="tm" x="40" y="694" font-size="13">confidence are not a calibrated</text>
  <text class="tm" x="40" y="714" font-size="13">“is this right?” score.</text>
  <text class="tm" x="40" y="734" font-size="13">Validate thresholds on labeled data.</text>
</svg>
